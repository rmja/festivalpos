<template>
  <style>
    .navbar {
      z-index: 1;
    }
    .top-navbar-actions .navbar-nav {
      flex-direction: row;
      font-size: 1.7em;
    }
    .top-navbar-actions .nav-item a.nav-link {
      padding: 0 10px;
    }
  </style>
  <nav class="navbar navbar-dark bg-dark">
    <button
      class="navbar-toggler collapsed"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbar"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="top-navbar-actions ms-auto">
      <slot></slot>
    </div>

    <div class="navbar-collapse collapse" id="navbar">
      <small style="color: #bbb">${pointOfSaleName}</small>
      <ul class="navbar-nav me-auto">
        <li
          repeat.for="nav of router.navigation"
          class="nav-item ${nav.active ? 'active' : ''} ${nav.settings.childRoutes ? 'dropdown' : ''}"

              class="nav-link dropdown-toggle"
              href

              >${nav.title}</a

            <div class="dropdown-menu">
              <a

                class="dropdown-item"
                href="${nav.href}/${route.route}"

                >${route.title}</a
              >
            </div>
          </template>
          <a else class="nav-link" href="${nav.href}" fast-click
            >${nav.title}</a
          >
        </li>
      </ul>
    </div>
